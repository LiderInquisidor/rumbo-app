<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo · Detalle del paquete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
:root{--card:#0d1322;--chip:#131a2c;--warn:#e8a23a;--gx:max(clamp(16px,3vw,40px),calc((100% - 1240px)/2 + clamp(16px,3vw,32px)))}
[data-theme="claro"]{--card:#fff;--chip:#eef0f7}
[data-theme="descanso"]{--card:#1a1713;--chip:#221e18}
.nav,.foot{padding-inline:var(--gx)}
.links a.active{color:var(--text);border-bottom-color:var(--accent-soft)}
.page{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:22px clamp(16px,3vw,32px) 40px}
.back{display:inline-block;font-size:.74rem;color:var(--accent-soft);margin-bottom:16px}
.hero{position:relative;height:clamp(220px,32vw,340px);border-radius:14px;overflow:hidden;background:var(--g);display:flex;align-items:flex-end;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,24,0) 35%,rgba(6,9,18,.88) 100%)}
.hero .in{position:relative;z-index:1;padding:clamp(16px,3vw,30px);width:100%}
.tag{display:inline-block;font-size:.62rem;font-weight:500;letter-spacing:.05em;padding:5px 11px;border-radius:999px;background:rgba(8,12,24,.7);border:1px solid rgba(139,147,255,.5);color:#d6d9ff;margin-bottom:12px}
.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:500;color:#fff}
.hero p{margin-top:8px;font-size:.84rem;color:#d4d9ea}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;margin-top:26px;align-items:start}
.sec{margin-bottom:28px}
.sec h2{font-size:1.05rem;font-weight:500;margin-bottom:12px}
.sec>p{font-size:.86rem;line-height:1.65;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.facts div{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.facts small{display:block;font-size:.64rem;color:var(--muted);margin-bottom:4px}
.facts b{font-weight:500;font-size:.84rem}
.low{color:var(--warn)}.okc{color:var(--ok)}
.lst{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:.82rem}
.lst li::before{content:"✓ ";color:var(--ok)}
.lst.no{color:var(--muted)}.lst.no li::before{content:"– ";color:var(--faint)}
.cond{padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:.8rem;line-height:1.6;color:var(--muted)}
.buy{position:sticky;top:16px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.buy small{font-size:.68rem;color:var(--muted)}
.buy .pr{font-size:2rem;font-weight:500;letter-spacing:-.02em;margin:4px 0 2px}.buy .pr em{font-size:.72rem;font-style:normal;color:var(--muted);font-weight:400}
.buy label{display:block;margin:18px 0 6px;font-size:.72rem}
.buy select{width:100%;height:40px;background:var(--field-bg);border:1px solid var(--field-line);border-radius:8px;color:var(--text);font:inherit;font-size:.82rem;padding:0 10px}
.est{margin-top:14px;padding:14px;border-radius:9px;background:var(--chip);display:flex;justify-content:space-between;align-items:baseline;font-size:.74rem;color:var(--muted)}
.est b{font-size:1.15rem;font-weight:500;color:var(--text)}
.btn{height:44px;border:1px solid var(--field-line);border-radius:8px;background:var(--chip);color:var(--text);font:inherit;font-size:.82rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;margin-top:16px}
.btn:hover{filter:brightness(1.1)}
.buy .n{margin-top:14px;font-size:.66rem;color:var(--muted);line-height:1.5}
.verc{display:block;margin-top:10px;text-align:center;font-size:.72rem;color:var(--accent-soft)}
.vacio{padding:60px 20px;text-align:center}.vacio strong{display:block;font-size:1.1rem;font-weight:500;margin-bottom:8px}.vacio span{display:block;color:var(--muted);font-size:.8rem;margin-bottom:18px}
.vacio .btn{display:inline-flex;width:auto;padding:0 22px;margin:0}
@media(max-width:900px){.cols{grid-template-columns:1fr}.buy{position:static}}
@media(max-width:560px){.facts{grid-template-columns:1fr}.lst{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="catalogo.html" aria-label="Rumbo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b93ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z"/></svg>
    <span>rumbo</span><i class="logo-dot"></i>
  </a>
  <nav class="links" aria-label="Principal">
    <a href="catalogo.html" class="active" aria-current="page">Explorar paquetes</a>
    <a href="comparar.html">Comparar</a>
    <a href="cotizacion.html">Cotización a medida</a>
    <a href="#" title="El centro de ayuda llegará en un próximo módulo">Ayuda</a>
  </nav>
  <div class="nav-right">
    <div class="theme" role="radiogroup" aria-label="Apariencia">
      <button type="button" role="radio" aria-checked="true" data-theme-set="oscuro"><i></i>Oscuro</button>
      <button type="button" role="radio" aria-checked="false" data-theme-set="claro"><i></i>Claro</button>
      <button type="button" role="radio" aria-checked="false" data-theme-set="descanso"><i></i>Descanso</button>
    </div>
    <span id="usuario"></span>
  </div>
</header>
<main class="page"><a class="back" href="catalogo.html">← Volver al catálogo</a><div id="vista"></div></main>
<footer class="foot">
  <span>© 2026 Rumbo · Viajes que se quedan contigo.</span>
  <nav><a href="#">Tratamiento de datos</a><a href="#">Términos y condiciones</a><span>Colombia · COP</span></nav>
</footer>
<script src="app.js"></script>
<script src="paquete-detalle.js"></script>
</body>
</html>
